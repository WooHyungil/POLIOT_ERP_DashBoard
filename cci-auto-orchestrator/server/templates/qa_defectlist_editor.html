<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCI QA DefectList Editor</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/static/styles.css?v=20260413o" />
  <script src="/static/auto_logout.js" defer></script>
</head>
<body class="has-side-nav">
  {% include "components/side_nav.html" %}

  <main class="container">
    <header class="topbar topbar-brand">
      <div class="brand-left">
        <div class="brand-mark" aria-hidden="true">
          <span class="dot dot-a"></span>
          <span class="dot dot-b"></span>
          <span class="dot dot-c"></span>
        </div>
        <div>
          <p class="eyebrow">Enterprise QA Orchestration</p>
          <h1>QA DefectList Editor</h1>
          <p class="meta-text">DefectList(B18:Z) 데이터를 편집하고 DefectList_Raw 기준 참고 정보를 함께 확인합니다.</p>
        </div>
      </div>
      <nav class="topnav">
        <span id="topbarUserName" class="topbar-username" hidden></span>
        <span id="topbarCountdown" class="topbar-countdown" hidden></span>
        <a class="navlink btn-ghost" href="/mypage" style="white-space:nowrap;">마이페이지</a>
        <form method="post" action="/auth/logout" style="margin:0;display:contents;">
          <button class="navlink" type="submit" style="white-space:nowrap;">로그아웃</button>
        </form>
      </nav>
    </header>

    <section class="card card-guidance" aria-label="편집 도구">
      <h2>편집 도구</h2>
      <div class="button-row">
        <button id="editorRefreshBtn" type="button" class="btn-secondary">DefectList 다시 불러오기</button>
        <button id="rawRefreshBtn" type="button" class="btn-ghost">DefectList_Raw 최신화 후 재조회</button>
      </div>
      <p id="editorHint" class="hint">B~I는 편집 컬럼입니다. G 컬럼은 자유 메모로 입력 가능합니다.</p>
      <div id="editorStats" class="stats-grid"></div>
    </section>

    <section class="card card-table" aria-label="DefectList 편집 테이블">
      <h2>DefectList (B18:Z)</h2>
      <div class="table-wrap" style="max-height:72vh;">
        <table id="defectlistEditorTable" class="recent-status-table">
          <thead id="defectlistEditorHead"></thead>
          <tbody id="defectlistEditorBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toastStack" class="toast-stack"></div>
  <script src="/static/side_nav.js?v=20260319c"></script>
  <script src="/static/qa_defectlist_editor.js?v=20260313a"></script>
</body>
</html>

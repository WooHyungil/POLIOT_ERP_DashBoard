<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 | CCI</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260318a" />
</head>
<body class="has-side-nav">
  {% include "components/side_nav.html" %}

  <main class="container">
    <header class="topbar topbar-brand">
      <div class="brand-left">
        <div>
          <p class="eyebrow">My Account</p>
          <h1>마이페이지</h1>
          <p class="meta-text">계정 정보를 수정하고 즉시 반영합니다.</p>
        </div>
      </div>
      <nav class="topnav">
        <a class="navlink" href="/">개요</a>
        <a class="navlink" href="/manage">관리</a>
        <a class="navlink" href="/qa">QA 대시보드</a>
        <span class="topbar-nav-sep" aria-hidden="true"></span>
        <span id="topbarUserName" class="topbar-username" hidden></span>
        <span id="topbarCountdown" class="topbar-countdown" hidden></span>
        <a class="navlink active" href="/mypage" style="white-space:nowrap;">마이페이지</a>
        <form method="post" action="/auth/logout" style="margin:0;display:contents;">
          <button class="navlink" type="submit" style="white-space:nowrap;">로그아웃</button>
        </form>
      </nav>
    </header>

    <section class="card card-guidance" style="margin-bottom:16px;">
      <h2>내 계정 정보</h2>
      <p class="hint">이름, 비밀번호, 계정 정보(소속/직책), 주소를 수정할 수 있습니다. 변경 사항은 즉시 반영됩니다.</p>
      <p id="mypageFlash" class="hint" style="min-height:22px;"></p>
    </section>

    <section class="grid manage-grid">
      <article class="card manage-panel">
        <h2>계정 정보 수정</h2>
        <form id="mypageForm">
          <div class="mypage-form-grid">
            <label>
              이메일 (변경 불가)
              <input id="mypageEmail" type="email" disabled style="background:#f5f8fc;color:#6a7f99;" />
            </label>
            <label>
              이름
              <input id="mypageName" type="text" placeholder="홍길동" maxlength="60" />
            </label>
            <label class="full-span">
              계정 정보 (소속 / 직책)
              <input id="mypageAddress" type="text" placeholder="예: QA개발팀 / 책임" maxlength="200" />
            </label>
          </div>

          <hr style="margin:16px 0;border:none;border-top:1px solid var(--line);" />

          <h3 style="margin:0 0 10px;font-size:0.96rem;">비밀번호 변경 <span style="font-size:0.78rem;font-weight:400;color:var(--muted);">(변경하지 않으면 빈칸으로 두세요)</span></h3>
          <div class="mypage-form-grid">
            <label>
              새 비밀번호
              <input id="mypagePw1" type="password" placeholder="8자 이상" autocomplete="new-password" minlength="8" maxlength="100" />
            </label>
            <label>
              비밀번호 확인
              <input id="mypagePw2" type="password" placeholder="동일하게 입력" autocomplete="new-password" minlength="8" maxlength="100" />
            </label>
          </div>

          <div class="button-row" style="margin-top:16px;">
            <button type="submit">저장</button>
            <button type="button" class="btn-ghost" onclick="window.history.back()">취소</button>
          </div>
        </form>
      </article>
    </section>
  </main>

  <script src="/static/side_nav.js?v=20260318b"></script>
  <script>
  (function () {
    const emailEl = document.getElementById("mypageEmail");
    const nameEl = document.getElementById("mypageName");
    const addrEl = document.getElementById("mypageAddress");
    const flash = document.getElementById("mypageFlash");
    const form = document.getElementById("mypageForm");

    function setFlash(msg, tone) {
      flash.textContent = msg;
      flash.setAttribute("data-tone", tone || "");
      flash.style.color = tone === "ok" ? "#1f6a3f" : tone === "error" ? "#9d1c1c" : "#915d00";
    }

    fetch("/api/auth/me", { credentials: "same-origin" })
      .then((r) => (r.ok ? r.json() : Promise.reject(r)))
      .then((data) => {
        const u = data.user || {};
        if (emailEl) emailEl.value = u.email || "";
        if (nameEl) nameEl.value = u.name || "";
        if (addrEl) addrEl.value = u.address || "";
      })
      .catch(() => setFlash("계정 정보를 불러오지 못했습니다.", "error"));

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const pw1 = document.getElementById("mypagePw1").value;
      const pw2 = document.getElementById("mypagePw2").value;

      if (pw1 || pw2) {
        if (pw1 !== pw2) {
          setFlash("비밀번호가 일치하지 않습니다.", "error");
          return;
        }
        if (pw1.length < 8) {
          setFlash("비밀번호는 8자 이상이어야 합니다.", "error");
          return;
        }
      }

      const payload = {
        name: nameEl.value.trim(),
        address: addrEl.value.trim(),
      };
      if (pw1) payload.password = pw1;

      try {
        const res = await fetch("/api/user/me", {
          method: "PUT",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          setFlash("저장되었습니다.", "ok");
          document.getElementById("mypagePw1").value = "";
          document.getElementById("mypagePw2").value = "";
          const topbarName = document.getElementById("topbarUserName");
          if (topbarName && data.user?.name) {
            topbarName.textContent = data.user.name + "님";
          }
        } else {
          setFlash(data.detail || "저장 중 오류가 발생했습니다.", "error");
        }
      } catch {
        setFlash("네트워크 오류가 발생했습니다.", "error");
      }
    });
  })();
  </script>
</body>
</html>

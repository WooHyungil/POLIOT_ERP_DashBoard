<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCI Dashboard - 회원가입</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/static/styles.css?v=20260318a" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .register-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .register-header h1 {
      font-size: 24px;
      margin: 15px 0 5px;
      color: #333;
    }
    .register-header p {
      font-size: 14px;
      color: #666;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .form-group.message {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 12px;
      color: #721c24;
      font-size: 13px;
    }
    .register-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }
    .register-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    }
    .register-button:active {
      transform: translateY(0);
    }
    .back-to-login {
      text-align: center;
      font-size: 13px;
    }
    .back-to-login a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    .back-to-login a:hover {
      text-decoration: underline;
    }
    .hint-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .register-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .register-grid .form-group {
      margin-bottom: 0;
    }
    .register-grid .full-span {
      grid-column: 1 / -1;
    }
    @media (max-width: 640px) {
      .register-container {
        padding: 28px 22px;
      }
      .register-grid {
        grid-template-columns: 1fr;
      }
      .register-grid .full-span {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h1>CCI Dashboard</h1>
      <p>POLIOT Device Control Center</p>
    </div>
    
    {% if popup_message %}
    <div class="form-group message">
      {{ popup_message }}
    </div>
    {% endif %}
    
    <form method="post" action="/auth/register" onsubmit="return validateRegisterForm(event)">
      <div class="register-grid">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" placeholder="이름 입력" required />
        </div>

        <div class="form-group">
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required />
        </div>

        <div class="form-group full-span">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="example@poliot.co.kr" required />
          <div class="hint-text">회사 이메일을 입력해 주세요</div>
        </div>

        <div class="form-group">
          <label for="title">직책/소속</label>
          <input type="text" id="title" name="title" placeholder="예: QA개발팀 / 책임" />
        </div>

        <div class="form-group">
          <label for="birth">생년월일</label>
          <input type="text" id="birth" name="birth" placeholder="1990-01-01" />
        </div>

        <div class="form-group full-span">
          <label for="address">주소</label>
          <input type="text" id="address" name="address" placeholder="주소 입력" />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호 입력" required minlength="8" />
          <div class="hint-text">최소 8자 이상 입력해 주세요</div>
        </div>

        <div class="form-group">
          <label for="password_confirm">비밀번호 확인</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="비밀번호 재입력" required minlength="8" />
        </div>
      </div>
      
      <input type="hidden" name="next" value="{{ next }}" />
      
      <button type="submit" class="register-button">
        <i class="fas fa-user-plus"></i> 회원가입
      </button>
    </form>
    
    <div class="back-to-login">
      <p>{{ message }}</p>
      <p style="margin: 0;"><a href="/auth/login?next={{ next }}">← 로그인 페이지로 돌아가기</a></p>
    </div>
  </div>

  <script>
    function validateRegisterForm(event) {
      const password = document.getElementById("password");
      const passwordConfirm = document.getElementById("password_confirm");
      if (!password || !passwordConfirm) return true;
      if (password.value !== passwordConfirm.value) {
        event.preventDefault();
        window.alert("비밀번호가 일치하지 않습니다.");
        passwordConfirm.focus();
        return false;
      }
      return true;
    }
  </script>
</body>
</html>

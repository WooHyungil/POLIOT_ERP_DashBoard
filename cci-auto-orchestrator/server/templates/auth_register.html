<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCI Dashboard - 회원가입</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/static/styles.css?v=20260324n" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .register-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .register-header h1 {
      font-size: 24px;
      margin: 15px 0 5px;
      color: #333;
    }
    .register-header p {
      font-size: 14px;
      color: #666;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .form-group.message {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 12px;
      color: #721c24;
      font-size: 13px;
    }
    .register-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }
    .register-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    }
    .register-button:active {
      transform: translateY(0);
    }
    .back-to-login {
      text-align: center;
      font-size: 13px;
    }
    .back-to-login a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    .back-to-login a:hover {
      text-decoration: underline;
    }
    .hint-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .register-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .register-grid .form-group {
      margin-bottom: 0;
    }
    .register-grid .full-span {
      grid-column: 1 / -1;
    }
    @media (max-width: 640px) {
      .register-container {
        padding: 28px 22px;
      }
      .register-grid {
        grid-template-columns: 1fr;
      }
      .register-grid .full-span {
        grid-column: auto;
      }
    }
    .auth-corner-nav {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-corner-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      background: rgba(15, 23, 42, 0.25);
      backdrop-filter: blur(6px);
      font-size: 13px;
      font-weight: 600;
    }
    .auth-corner-link:hover {
      background: rgba(15, 23, 42, 0.4);
    }
  </style>
</head>
<body>
  <div class="auth-corner-nav" aria-label="빠른 이동">
    <a class="auth-corner-link" href="/"><i class="fas fa-house"></i> 홈</a>
    <a class="auth-corner-link" href="/auth/login?next={{ next }}"><i class="fas fa-right-to-bracket"></i> 로그인</a>
  </div>
  <div class="register-container">
    <div class="register-header">
      <h1>CCI Dashboard</h1>
      <p>POLIOT Device Control Center</p>
    </div>
    
    {% if popup_message %}
    <div class="form-group message">
      {{ popup_message }}
    </div>
    {% endif %}
    
    <form method="post" action="/auth/register" onsubmit="return validateRegisterForm(event)">
      <div class="register-grid">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" placeholder="이름 입력" required />
        </div>

        <div class="form-group">
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required pattern="^(?:\+?\d[\d\-\s]{7,18}\d)$" title="전화번호 형식이 올바르지 않습니다. 예: 010-1234-5678" />
        </div>

        <div class="form-group full-span">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="example@poliot.co.kr" required pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" title="올바른 이메일 형식을 입력해 주세요." />
          <div class="hint-text">회사 이메일을 입력해 주세요</div>
        </div>

        <div class="form-group">
          <label for="title">직책/소속</label>
          <input type="text" id="title" name="title" placeholder="SW품질/책임" />
        </div>

        <div class="form-group">
          <label for="birth">생년월일</label>
          <input type="text" id="birth" name="birth" placeholder="1990-01-01" pattern="^\d{4}-\d{2}-\d{2}$" title="YYYY-MM-DD 형식으로 입력해 주세요." />
        </div>

        <div class="form-group full-span">
          <label for="address">주소</label>
          <input type="text" id="address" name="address" placeholder="주소 입력" />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호 입력" required minlength="8" maxlength="100" pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,100}$" title="영문, 숫자, 특수문자를 각각 1개 이상 포함해 8~100자로 입력해 주세요." />
          <div class="hint-text">8~100자, 영문/숫자/특수문자를 각각 1개 이상 포함해 주세요</div>
        </div>

        <div class="form-group">
          <label for="password_confirm">비밀번호 확인</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="비밀번호 재입력" required minlength="8" maxlength="100" pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,100}$" title="영문, 숫자, 특수문자를 각각 1개 이상 포함해 8~100자로 입력해 주세요." />
        </div>
      </div>
      
      <input type="hidden" name="next" value="{{ next }}" />
      
      <button type="submit" class="register-button">
        <i class="fas fa-user-plus"></i> 회원가입
      </button>
    </form>
    
    <div class="back-to-login">
      <p>{{ message }}</p>
      <p style="margin: 0;"><a href="/auth/login?next={{ next }}">← 로그인 페이지로 돌아가기</a></p>
    </div>
  </div>

  <script>
    const EMAIL_REGEX = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
    const PASSWORD_REGEX = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,100}$/;
    const PHONE_REGEX = /^(?:\+?\d[\d\-\s]{7,18}\d)$/;
    const BIRTH_REGEX = /^\d{4}-\d{2}-\d{2}$/;

    function isValidBirthDate(value) {
      const text = String(value || "").trim();
      if (!text) return true;
      if (!BIRTH_REGEX.test(text)) return false;
      const [yearText, monthText, dayText] = text.split("-");
      const year = Number(yearText);
      const month = Number(monthText);
      const day = Number(dayText);
      const d = new Date(year, month - 1, day);
      return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day;
    }

    function validateRegisterForm(event) {
      const email = document.getElementById("email");
      const phone = document.getElementById("phone");
      const birth = document.getElementById("birth");
      const password = document.getElementById("password");
      const passwordConfirm = document.getElementById("password_confirm");
      if (!email || !phone || !birth || !password || !passwordConfirm) return true;
      if (!EMAIL_REGEX.test(String(email.value || "").trim().toLowerCase())) {
        event.preventDefault();
        window.alert("이메일 형식이 올바르지 않습니다.");
        email.focus();
        return false;
      }
      if (!PHONE_REGEX.test(String(phone.value || "").trim())) {
        event.preventDefault();
        window.alert("전화번호 형식이 올바르지 않습니다. 예: 010-1234-5678");
        phone.focus();
        return false;
      }
      if (!isValidBirthDate(birth.value || "")) {
        event.preventDefault();
        window.alert("생년월일 형식이 올바르지 않습니다. YYYY-MM-DD 형식으로 입력해 주세요.");
        birth.focus();
        return false;
      }
      if (!PASSWORD_REGEX.test(password.value || "")) {
        event.preventDefault();
        window.alert("비밀번호는 8~100자이며, 영문/숫자/특수문자를 각각 1개 이상 포함해야 합니다.");
        password.focus();
        return false;
      }
      if (password.value !== passwordConfirm.value) {
        event.preventDefault();
        window.alert("비밀번호가 일치하지 않습니다.");
        passwordConfirm.focus();
        return false;
      }
      return true;
    }
  </script>
</body>
</html>

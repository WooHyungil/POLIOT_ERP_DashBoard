<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full_TC 업로드</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/static/styles.css?v=20260324n" />
  <script src="/static/auto_logout.js"></script>
</head>
<body class="has-side-nav">
  {% include "components/side_nav.html" %}
  <main class="container">
    <header class="topbar topbar-brand">
      <div class="brand-left">
        <div class="brand-mark" aria-hidden="true">
          <span class="dot dot-a"></span>
          <span class="dot dot-b"></span>
          <span class="dot dot-c"></span>
        </div>
        <div>
          <p class="eyebrow">Data Upload Center</p>
          <h1>Full_TC 업로드</h1>
          <p class="meta-text">업로드한 Full_TC 엑셀의 시트 목록/데이터를 Full_TC API에서 우선 사용합니다.</p>
        </div>
      </div>
      <nav class="topnav">
        <span id="topbarUserName" class="topbar-username" hidden></span>
        <span id="topbarCountdown" class="topbar-countdown" hidden></span>
        <a class="navlink btn-ghost" href="/mypage" style="white-space:nowrap;">마이페이지</a>
        <form method="post" action="/auth/logout" style="margin:0;display:contents;">
          <button class="navlink" type="submit" style="white-space:nowrap;">로그아웃</button>
        </form>
      </nav>
    </header>

    <section class="grid grid-wide">
      <article class="card">
        <h2>파일 업로드</h2>
        <p class="hint">.xlsx, .csv 파일을 지원합니다.</p>
        <form id="fullTcUploadForm" enctype="multipart/form-data">
          <input id="fullTcFile" type="file" name="file" accept=".xlsx,.csv" required />
          <button id="fullTcUploadBtn" type="submit">업로드 및 반영</button>
        </form>
        <p id="fullTcUploadHint" class="hint" style="margin-top:10px;">업로드 대기 중</p>
      </article>

      <article class="card">
        <h2>현재 데이터 소스</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>항목</th>
                <th>값</th>
              </tr>
            </thead>
            <tbody id="fullTcStatusRows">
              <tr><td colspan="2">확인 중...</td></tr>
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="/static/side_nav.js?v=20260319c"></script>
  <script src="/static/upload_full_tc.js?v=20260320a"></script>
</body>
</html>

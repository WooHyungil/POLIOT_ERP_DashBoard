<!doctype html>
<html lang="ko">
<head>
    <script src="/static/auto_logout.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCI Excel Center</title>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/static/styles.css?v=20260321d" />
</head>
<body class="has-side-nav">
  {% include "components/side_nav.html" %}
  <main class="container">
    <header class="topbar">
      <div>
        <p class="eyebrow">Enterprise QA Orchestration</p>
        <h1>Excel Center</h1>
      </div>
      <nav class="topnav">
        <a class="navlink" href="/">개요</a>
        <a class="navlink" href="/defects">결함 상세</a>
        <a class="navlink active" href="/excel">엑셀 센터</a>
        <a class="navlink" href="/#shortcutManagerSection">바로가기</a>
        <span class="topbar-nav-sep" aria-hidden="true"></span>
        <span id="topbarUserName" class="topbar-username" hidden></span>
        <span id="topbarCountdown" class="topbar-countdown" hidden></span>
        <a class="navlink btn-ghost" href="/mypage" style="white-space:nowrap;">마이페이지</a>
        <form method="post" action="/auth/logout" style="margin:0;display:contents;">
          <button class="navlink" type="submit" style="white-space:nowrap;">로그아웃</button>
        </form>
      </nav>
    </header>

    <section class="grid">
      <article class="card card-control">
        <h2>업로드 + AI 변환</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <input type="file" name="file" accept=".xlsx,.xls" required />
          <button type="submit">업로드 시작</button>
        </form>
        <div class="button-row">
          <button id="loadDefaultBtn" class="btn-secondary" type="button">기본 엑셀 로드</button>
          <button id="convertDefaultBtn" class="btn-ghost" type="button">기본 엑셀 AI 변환</button>
        </div>
        <div id="jobBox" class="job-box">
          <p id="jobStatus">대기 중</p>
          <div class="progress"><div id="jobBar" class="progress-bar"></div></div>
          <p id="jobResult" class="hint"></p>
        </div>
      </article>

      <article class="card card-table">
        <h2>원본 엑셀(23개 컬럼) 미리보기</h2>
        <p id="previewMeta" class="hint"></p>
        <div class="table-wrap">
          <table id="excelTable"></table>
        </div>
      </article>
    </section>

    <section class="grid grid-wide">
      <article class="card card-table">
        <h2>미해결 자동화 대상 (TODO)</h2>
        <p id="todoMeta" class="hint"></p>
        <table>
          <thead><tr><th>TC</th><th>Step</th><th>Action</th><th>Target</th><th>행</th></tr></thead>
          <tbody id="todoTable"></tbody>
        </table>
      </article>
      <article class="card card-table">
        <h2>규칙 제안</h2>
        <button id="suggestRuleBtn" type="button" class="btn-secondary">규칙 제안 새로고침</button>
        <table>
          <thead><tr><th>TODO 키</th><th>추천 Action</th><th>추천 Target</th><th>빈도</th></tr></thead>
          <tbody id="ruleSuggestTable"></tbody>
        </table>
      </article>
    </section>
  </main>
  <script src="/static/side_nav.js?v=20260321f"></script>
  <script src="/static/excel_center.js?v=20260321d"></script>
</body>
</html>

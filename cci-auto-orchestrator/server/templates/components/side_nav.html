<!-- 긴급 게시물 플로팅 배너 (모든 페이지 공통) -->
<div id="globalBoardUrgentFloat" class="board-urgent-float" hidden></div>
<!-- @멘션 알림 플로팅 -->
<div id="globalMentionFloat" class="board-urgent-float board-urgent-mention" hidden></div>
<script>
(function() {
  'use strict';
	const GLOBAL_URGENT_POLL_MS = 10000;
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtDateShort(iso) {
    if (!iso) return '';
    try {
      return new Intl.DateTimeFormat('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
        .format(new Date(iso + (iso.includes('T') ? 'Z' : '')));
    } catch { return iso; }
  }
  async function loadGlobalUrgent() {
    try {
      const r = await fetch('/api/board/urgent', { credentials: 'include' });
      if (!r.ok) return;
      const data = await r.json();
      const items = data.items || [];
      const mentions = data.mentions || [];
			const unreadItems = data.unread_items || [];
			const priorityMeta = function (priority) {
				const value = String(priority || 'Medium');
				if (value === 'High') return { cls: 'priority-high', icon: 'fas fa-exclamation-circle', title: '긴급 게시물' };
				if (value === 'Low') return { cls: 'priority-low', icon: 'fas fa-arrow-circle-down', title: '일반 게시물' };
				return { cls: 'priority-medium', icon: 'fas fa-minus-circle', title: '중요 게시물' };
			};
			const signature = items.map((p) => `${String(p.id || '')}:${String(p.created_at || '')}`).join('|');
			let dismissedSignature = '';
			try {
				dismissedSignature = String(localStorage.getItem('cci_global_urgent_dismissed_signature') || '');
			} catch {}
      // 사이드 네비 닷 표시 (urgent 또는 mention이 있으면 표시)
      const dot = document.getElementById('sideNavBoardUrgentDot');
	if (dot) dot.hidden = items.length === 0 && mentions.length === 0 && unreadItems.length === 0;

      // ── 멘션 알림 플로팅 (모든 페이지) ──
      const mentionFloat = document.getElementById('globalMentionFloat');
      if (mentionFloat) {
				if (mentions.length === 0 && unreadItems.length === 0) {
          mentionFloat.hidden = true;
        } else {
					const mentionSig = `${mentions.map(m => `${m.comment_id}:${m.created_at}`).join('|')}::${unreadItems.map(u => `${u.id}:${u.created_at}`).join('|')}`;
          let dismissedMentionSig = '';
          try { dismissedMentionSig = String(localStorage.getItem('cci_mention_dismissed_sig') || ''); } catch {}
          if (dismissedMentionSig && dismissedMentionSig === mentionSig) {
            mentionFloat.hidden = true;
          } else {
            mentionFloat.hidden = false;
						const mentionLead = unreadItems[0] || items[0] || { priority: 'Medium' };
						mentionFloat.className = `board-urgent-float board-urgent-mention ${priorityMeta(mentionLead.priority).cls}`;
            mentionFloat.innerHTML = `
              <div class="board-urgent-header" id="globalMentionToggle">
                <span class="board-urgent-fire">🔔</span>
								<span class="board-urgent-title">내 알림</span>
								<span class="board-urgent-count">${mentions.length + unreadItems.length}</span>
                <button type="button" class="board-urgent-collapse" id="globalMentionDismissBtn" title="닫기">✕</button>
                <button type="button" class="board-urgent-collapse" id="globalMentionCollapseBtn" title="접기/펼치기">▼</button>
              </div>
              <div class="board-urgent-body" id="globalMentionBody">
								${mentions.length > 0 ? `<div class="board-urgent-item-title" style="font-weight:700; opacity:.85; margin:2px 0 6px;">@ 멘션</div>` : ''}
                ${mentions.map(m => `
                  <a class="board-urgent-item" href="/board#${esc(m.post_id)}">
                    <span class="board-urgent-item-title"><b>${esc(m.author_name)}</b>님이 댓글에서 회원님을 언급했습니다</span>
                    <span class="board-urgent-item-date">${fmtDateShort(m.created_at)}</span>
                  </a>`).join('')}
								${unreadItems.length > 0 ? `<div class="board-urgent-item-title" style="font-weight:700; opacity:.85; margin:8px 0 6px;">읽지 않은 공지</div>` : ''}
								${unreadItems.map(p => `
									<a class="board-urgent-item ${priorityMeta(p.priority).cls}" href="/board#${esc(p.id)}">
										<span class="board-urgent-item-title">${esc(p.title)}</span>
										<span class="board-urgent-item-date">${fmtDateShort(p.created_at)}</span>
									</a>`).join('')}
              </div>`;
            document.getElementById('globalMentionCollapseBtn')?.addEventListener('click', (e) => {
              e.preventDefault();
              const body = document.getElementById('globalMentionBody');
              const btn = document.getElementById('globalMentionCollapseBtn');
              const collapsed = body.style.display === 'none';
              body.style.display = collapsed ? '' : 'none';
              btn.textContent = collapsed ? '▼' : '▲';
            });
            document.getElementById('globalMentionDismissBtn')?.addEventListener('click', (e) => {
              e.preventDefault();
              mentionFloat.hidden = true;
              try { localStorage.setItem('cci_mention_dismissed_sig', mentionSig); } catch {}
            });
          }
        }
      }

      // board 페이지에는 이미 자체 플로팅이 있으므로 urgent 고지 사항은 건너뜀
      if (window.location.pathname === '/board') return;

      const float = document.getElementById('globalBoardUrgentFloat');
      if (!float) return;
			if (items.length === 0) { float.hidden = true; return; }
			if (dismissedSignature && dismissedSignature === signature) {
				float.hidden = true;
				return;
			}
			const leadMeta = priorityMeta(items[0]?.priority);
      float.hidden = false;
			float.className = `board-urgent-float ${leadMeta.cls}`;
      float.innerHTML = `
        <div class="board-urgent-header" id="globalUrgentToggle">
					<span class="board-urgent-fire"><i class="${leadMeta.icon}"></i></span>
					<span class="board-urgent-title">${leadMeta.title}</span>
          <span class="board-urgent-count">${items.length}</span>
					<button type="button" class="board-urgent-collapse" id="globalUrgentDismissBtn" title="닫기">✕</button>
          <button type="button" class="board-urgent-collapse" id="globalUrgentCollapseBtn" title="접기/펼치기">▼</button>
        </div>
        <div class="board-urgent-body" id="globalUrgentBody">
          ${items.map(p => `
						<a class="board-urgent-item ${priorityMeta(p.priority).cls}" href="/board#${esc(p.id)}">
              <span class="board-urgent-item-title">${esc(p.title)}</span>
              <span class="board-urgent-item-date">${fmtDateShort(p.created_at)}</span>
            </a>`).join('')}
          <a href="/board" class="board-urgent-more">게시판 전체 보기 →</a>
        </div>`;

      document.getElementById('globalUrgentCollapseBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        const body = document.getElementById('globalUrgentBody');
        const btn = document.getElementById('globalUrgentCollapseBtn');
        const collapsed = body.style.display === 'none';
        body.style.display = collapsed ? '' : 'none';
        btn.textContent = collapsed ? '▼' : '▲';
      });

			document.getElementById('globalUrgentDismissBtn')?.addEventListener('click', (e) => {
				e.preventDefault();
				float.hidden = true;
				try {
					localStorage.setItem('cci_global_urgent_dismissed_signature', signature);
				} catch {}
			});
    } catch (e) { /* ignore */ }
  }
	document.addEventListener('DOMContentLoaded', () => {
		loadGlobalUrgent();
		window.setInterval(loadGlobalUrgent, GLOBAL_URGENT_POLL_MS);
	});
	document.addEventListener('visibilitychange', () => {
		if (!document.hidden) loadGlobalUrgent();
	});
})();
</script>

<!-- 긴급 게시물 플로팅 배너 (모든 페이지 공통) -->
<div id="globalBoardUrgentFloat" class="board-urgent-float" hidden></div>
<script>
(function() {
  'use strict';
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtDateShort(iso) {
    if (!iso) return '';
    try {
      return new Intl.DateTimeFormat('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
        .format(new Date(iso + (iso.includes('T') ? 'Z' : '')));
    } catch { return iso; }
  }
  async function loadGlobalUrgent() {
    try {
      const r = await fetch('/api/board/urgent', { credentials: 'include' });
      if (!r.ok) return;
      const data = await r.json();
      const items = data.items || [];
			const signature = items.map((p) => `${String(p.id || '')}:${String(p.created_at || '')}`).join('|');
			let dismissedSignature = '';
			try {
				dismissedSignature = String(localStorage.getItem('cci_global_urgent_dismissed_signature') || '');
			} catch {}
      // 사이드 네비 닷 표시
      const dot = document.getElementById('sideNavBoardUrgentDot');
      if (dot) dot.hidden = items.length === 0;

      // board 페이지에는 이미 자체 플로팅이 있으므로 건너뜀
      if (window.location.pathname === '/board') return;

      const float = document.getElementById('globalBoardUrgentFloat');
      if (!float) return;
			if (items.length === 0) { float.hidden = true; return; }
			if (dismissedSignature && dismissedSignature === signature) {
				float.hidden = true;
				return;
			}
      float.hidden = false;
      float.innerHTML = `
        <div class="board-urgent-header" id="globalUrgentToggle">
          <span class="board-urgent-fire"><i class="fas fa-fire"></i></span>
          <span class="board-urgent-title">긴급 게시물</span>
          <span class="board-urgent-count">${items.length}</span>
					<button type="button" class="board-urgent-collapse" id="globalUrgentDismissBtn" title="닫기">✕</button>
          <button type="button" class="board-urgent-collapse" id="globalUrgentCollapseBtn" title="접기/펼치기">▼</button>
        </div>
        <div class="board-urgent-body" id="globalUrgentBody">
          ${items.map(p => `
            <a class="board-urgent-item" href="/board#${esc(p.id)}">
              <span class="board-urgent-item-title">${esc(p.title)}</span>
              <span class="board-urgent-item-date">${fmtDateShort(p.created_at)}</span>
            </a>`).join('')}
          <a href="/board" class="board-urgent-more">게시판 전체 보기 →</a>
        </div>`;

      document.getElementById('globalUrgentCollapseBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        const body = document.getElementById('globalUrgentBody');
        const btn = document.getElementById('globalUrgentCollapseBtn');
        const collapsed = body.style.display === 'none';
        body.style.display = collapsed ? '' : 'none';
        btn.textContent = collapsed ? '▼' : '▲';
      });

			document.getElementById('globalUrgentDismissBtn')?.addEventListener('click', (e) => {
				e.preventDefault();
				float.hidden = true;
				try {
					localStorage.setItem('cci_global_urgent_dismissed_signature', signature);
				} catch {}
			});
    } catch (e) { /* ignore */ }
  }
  document.addEventListener('DOMContentLoaded', loadGlobalUrgent);
})();
</script>

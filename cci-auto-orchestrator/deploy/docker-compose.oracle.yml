services:
  cci-dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cci-dashboard
    restart: unless-stopped
    environment:
      PORT: 8080
      TZ: Asia/Seoul
    ports:
      - "${CCI_HOST_PORT:-8000}:8080"
    volumes:
      - /opt/cci/data/config:/app/config
      - /opt/cci/data/runtime:/app/runtime
      - /opt/cci/data/server-db:/app/server/db
      - /opt/cci/data/server-artifacts:/app/server/artifacts
      - /opt/cci/data/server-exports:/app/server/exports
      - /opt/cci/data/server-reports:/app/server/reports
      - /opt/cci/data/server-uploads:/app/server/uploads
